name: Deploy to nuxt.rucode.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/nuxt.rucode.net

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & test
        run: |
          npm run lint:fsd
          npm run test

      - name: Build application
        run: npm run build

      - name: Clean old .output on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf ${{ env.DEPLOY_PATH }}/.output
            mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Deploy .output to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: '.output'
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy ecosystem.config.cjs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'ecosystem.config.cjs'
          target: ${{ env.DEPLOY_PATH }}

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            /usr/local/bin/pm2 delete nuxt-rucode || true
            /usr/local/bin/pm2 start ecosystem.config.cjs
            /usr/local/bin/pm2 save

      # Манифест блоков уходит в CMS после деплоя: без него админка не создаёт и не сохраняет страницы.
      # Отправка идёт через сайт (server/routes/cms-api/projects): CMS_API_URL = https://nuxt.rucode.net/cms-api,
      # CMS_CI_KEY — ключ CI проекта (показывается один раз при create-project). Шаг пропускается, пока секреты не заданы.
      - name: Publish block manifest to CMS
        # Сбой отправки (CMS недоступна, неверный ключ) не должен ронять деплой: сайт к этому моменту уже выкачен.
        continue-on-error: true
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          CMS_CI_KEY: ${{ secrets.CMS_CI_KEY }}
        run: |
          if [ -z "$CMS_API_URL" ] || [ -z "$CMS_CI_KEY" ]; then
            echo "CMS_API_URL / CMS_CI_KEY не заданы, манифест не отправляется"
            exit 0
          fi
          npm run manifest
          curl --fail-with-body -sS -X PUT "${CMS_API_URL%/}/projects/rucode/manifest" \
            -H "x-ci-key: $CMS_CI_KEY" -H "content-type: application/json" \
            --data-binary @.output/manifest.json
