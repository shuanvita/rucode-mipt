name: Deploy to nuxt.rucode.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/nuxt.rucode.net

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & test
        run: |
          npm run lint:fsd
          npm run test

      # Скриншоты блоков для каталога в админке CMS: пишутся в public/previews до сборки, чтобы попасть
      # в .output/public; поле preview в манифест добавляет `npm run manifest`. Сбой не роняет деплой.
      - name: Block screenshots
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run block-shots

      - name: Build application
        run: npm run build

      - name: Clean old .output on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            rm -rf ${{ env.DEPLOY_PATH }}/.output
            mkdir -p ${{ env.DEPLOY_PATH }}

      # Конфиг pm2 едет внутри .output: отдельная копия в корне деплоя падала в tar с "File exists",
      # когда сервер не давал заменить уже лежащий там файл. Папка .output пересоздаётся при каждом деплое.
      - name: Add pm2 config to .output
        run: cp ecosystem.config.cjs .output/ecosystem.config.cjs

      - name: Deploy .output to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: '.output'
          target: ${{ env.DEPLOY_PATH }}

      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            /usr/local/bin/pm2 delete nuxt-rucode || true
            /usr/local/bin/pm2 start .output/ecosystem.config.cjs
            /usr/local/bin/pm2 save

      # Манифест блоков уходит в CMS после деплоя: без него админка не создаёт и не сохраняет страницы.
      # Отправка идёт через сайт (server/routes/cms-api/projects): CMS_API_URL = https://nuxt.rucode.net/cms-api,
      # CMS_CI_KEY — ключ CI проекта (показывается один раз при create-project). Шаг пропускается (с предупреждением), пока секреты не заданы.
      - name: Publish block manifest to CMS
        # Сайт к этому шагу уже выкачен, поэтому сбой не откатывает деплой, но делает job красным
        # (раньше continue-on-error скрывал 401 от CMS).
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
          CMS_CI_KEY: ${{ secrets.CMS_CI_KEY }}
          # Уникальная версия на каждый деплой: дата без времени давала одинаковую версию в пределах дня.
          MANIFEST_VERSION: ${{ github.sha }}
        run: |
          if [ -z "$CMS_API_URL" ] || [ -z "$CMS_CI_KEY" ]; then
            echo "::warning::CMS_API_URL / CMS_CI_KEY не заданы, манифест НЕ опубликован"
            exit 0
          fi
          npm run manifest
          if ! curl --fail-with-body -sS -X PUT "${CMS_API_URL%/}/projects/rucode/manifest" \
            -H "x-ci-key: $CMS_CI_KEY" -H "content-type: application/json" \
            --data-binary @.output/manifest.json; then
            echo "::error::Манифест блоков НЕ опубликован в CMS (проверьте CMS_API_URL и CMS_CI_KEY)"
            exit 1
          fi
          echo "Манифест опубликован, версия $MANIFEST_VERSION"
